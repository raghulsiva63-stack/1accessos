name: Passkey-X verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.7.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate package manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'))"
      - name: Run crypto, API client, and tamper tests
        run: npm test
      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run Phase 0 static security checks
        run: node scripts/check-phase0.mjs
      - name: Run Phase 1 static product and security checks
        run: node scripts/check-phase1.mjs
      - name: Run Phase 2 collaboration and authorization checks
        run: node scripts/check-phase2.mjs
      - name: Test ciphertext-only CLI
        working-directory: apps/cli
        run: npm test
      - name: Install web application dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint web application
        working-directory: apps/web
        run: npm run lint
      - name: Build and test web application
        working-directory: apps/web
        run: npm test
      - name: Audit web production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Install extension dependencies
        working-directory: apps/extension
        run: npm ci
      - name: Build and test Chromium extension
        working-directory: apps/extension
        run: npm test
      - name: Audit extension production dependencies
        working-directory: apps/extension
        run: npm audit --omit=dev --audit-level=high
      - name: Validate desktop packaging configuration
        working-directory: apps/desktop
        run: |
          npm ci
          npm exec --offline tauri -- --version
          node -e "JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json','utf8'))"
      - name: Reject common committed secrets
        shell: bash
        run: |
          if git grep -nEI '(sb_secret_|service_role|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16})' -- ':!*.md' ':!.github/workflows/*'; then
            echo 'Potential committed secret detected.' >&2
            exit 1
          fi
