[build]
  base = "apps/web"
  command = "node ../../scripts/build-hosted-clients.mjs"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# Passkeys are bound permanently to the production relying-party domain.
# Keep non-production deploys disabled so preview URLs can never enrol credentials.
[context.production.environment]
  NEXT_PUBLIC_PASSKEYS_ENABLED = "true"
  NEXT_PUBLIC_PHONE_MFA_ENABLED = "false"
  NEXT_PUBLIC_BILLING_ENABLED = "true"
  NEXT_PUBLIC_PLAN_CATALOG_ENABLED = "true"
  NEXT_PUBLIC_STRIPE_TEST_MODE = "true"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAEqKBVujyYXO63wI"

[context.deploy-preview.environment]
  NEXT_PUBLIC_PASSKEYS_ENABLED = "false"
  NEXT_PUBLIC_PHONE_MFA_ENABLED = "false"
  NEXT_PUBLIC_BILLING_ENABLED = "false"
  NEXT_PUBLIC_PLAN_CATALOG_ENABLED = "false"
  NEXT_PUBLIC_STRIPE_TEST_MODE = "true"

[context.branch-deploy.environment]
  NEXT_PUBLIC_PASSKEYS_ENABLED = "false"
  NEXT_PUBLIC_PHONE_MFA_ENABLED = "false"
  NEXT_PUBLIC_BILLING_ENABLED = "false"
  NEXT_PUBLIC_PLAN_CATALOG_ENABLED = "false"
  NEXT_PUBLIC_STRIPE_TEST_MODE = "true"

# Public installer files live in a dedicated bucket with no client write policy.
[[redirects]]
  from = "/downloads/desktop/*"
  to = "https://wkkmyacbhqloubtwvjom.supabase.co/storage/v1/object/public/passkey-x-client-releases/desktop/:splat"
  status = 200
  force = true

# Customer-facing REST boundary. Only supported Passkey-X application routes are
# exposed; provider callbacks and Supabase's generic Data API are not proxied.
[[redirects]]
  from = "/api/v1/*"
  to = "https://wkkmyacbhqloubtwvjom.supabase.co/functions/v1/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/billing"
  to = "https://wkkmyacbhqloubtwvjom.supabase.co/functions/v1/billing"
  status = 200
  force = true

[[redirects]]
  from = "/api/tenant-sms"
  to = "https://wkkmyacbhqloubtwvjom.supabase.co/functions/v1/tenant-sms"
  status = 200
  force = true

[[redirects]]
  from = "/api/account-lifecycle"
  to = "https://wkkmyacbhqloubtwvjom.supabase.co/functions/v1/account-lifecycle"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://wkkmyacbhqloubtwvjom.supabase.co wss://wkkmyacbhqloubtwvjom.supabase.co; font-src 'self' data:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/extension/connect*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
