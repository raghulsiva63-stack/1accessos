[build]
  base = "apps/web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Passkeys are bound permanently to the production relying-party domain.
# Keep non-production deploys disabled so preview URLs can never enrol credentials.
[context.production.environment]
  NEXT_PUBLIC_PASSKEYS_ENABLED = "true"
  NEXT_PUBLIC_PHONE_MFA_ENABLED = "false"
  NEXT_PUBLIC_BILLING_ENABLED = "true"
  NEXT_PUBLIC_PLAN_CATALOG_ENABLED = "true"
  NEXT_PUBLIC_STRIPE_TEST_MODE = "true"

[context.deploy-preview.environment]
  NEXT_PUBLIC_PASSKEYS_ENABLED = "false"
  NEXT_PUBLIC_PHONE_MFA_ENABLED = "false"
  NEXT_PUBLIC_BILLING_ENABLED = "false"
  NEXT_PUBLIC_PLAN_CATALOG_ENABLED = "false"
  NEXT_PUBLIC_STRIPE_TEST_MODE = "true"

[context.branch-deploy.environment]
  NEXT_PUBLIC_PASSKEYS_ENABLED = "false"
  NEXT_PUBLIC_PHONE_MFA_ENABLED = "false"
  NEXT_PUBLIC_BILLING_ENABLED = "false"
  NEXT_PUBLIC_PLAN_CATALOG_ENABLED = "false"
  NEXT_PUBLIC_STRIPE_TEST_MODE = "true"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://wkkmyacbhqloubtwvjom.supabase.co wss://wkkmyacbhqloubtwvjom.supabase.co; font-src 'self' data:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
