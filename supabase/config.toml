[functions.billing]
verify_jwt = true

# Stripe sends no Supabase JWT. The handler authenticates every request using
# Stripe's signed raw body before applying an idempotent database transaction.
[functions.stripe-webhook]
verify_jwt = false

# Supabase Auth signs Send SMS Hook requests with Standard Webhooks. The
# function verifies that signature before sending a provider request.
[functions.sent-sms-hook]
verify_jwt = false

# Sent sends no Supabase JWT. This receiver verifies Sent's raw-body HMAC,
# timestamp freshness, and event idempotency before applying delivery state.
[functions.sent-webhook]
verify_jwt = false

# User-initiated account deletion and tenant messaging both require an active
# Supabase access token. Their handlers also repeat authorization checks before
# any destructive action or use of a tenant-scoped provider credential.
[functions.account-lifecycle]
verify_jwt = true

[functions.tenant-sms]
verify_jwt = true
