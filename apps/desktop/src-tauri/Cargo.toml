[package]
name = "passkey-x"
version = "0.2.0"
description = "Passkey-X zero-knowledge personal vault"
authors = ["Vlightsoft"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "passkey_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.4", features = [] }
tauri-plugin-opener = "2"
