plugins { id 'com.android.application' }

android {
    namespace 'com.vlightsoft.passkeyx'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vlightsoft.passkeyx.preview'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        // Sideload-only preview. The CI signing key is temporary; no key enters source control.
        preview { initWith release; debuggable false; signingConfig signingConfigs.debug; matchingFallbacks = ['release'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
