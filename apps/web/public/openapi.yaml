openapi: 3.1.0
info:
  title: Passkey-X Production API
  version: 1.0.0
  description: |
    Production REST contract for Passkey-X by Vlightsoft. User routes require a
    Supabase Auth access token and enforce tenant/workspace Row Level Security.
    Vault writes accept client-encrypted ciphertext only. Never submit plaintext
    passwords, private keys, access tokens, recovery keys, page/form content, or raw AI prompts.
servers:
  - url: https://wkkmyacbhqloubtwvjom.supabase.co/functions/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - { name: System }
  - { name: Vault }
  - { name: Access }
  - { name: SaaS }
  - { name: Billing }
  - { name: Notifications }
  - { name: Account }
  - { name: Provider callbacks }
paths:
  /v1/health:
    get:
      tags: [System]
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { const: ok } }
  /v1/item-types:
    get:
      tags: [System]
      operationId: listItemTypes
      responses:
        '200': { description: Supported encrypted item types }
        '401': { $ref: '#/components/responses/Error' }
  /v1/workspaces:
    get:
      tags: [Vault]
      operationId: listWorkspaces
      responses:
        '200': { description: Workspaces available to the authenticated identity }
        '401': { $ref: '#/components/responses/Error' }
  /v1/workspaces/{workspace_id}/members:
    parameters: [{ $ref: '#/components/parameters/WorkspacePathId' }]
    get:
      tags: [Vault]
      operationId: listWorkspaceMembers
      responses:
        '200': { description: Members visible under workspace RLS }
        '403': { $ref: '#/components/responses/Error' }
  /v1/vault-items:
    get:
      tags: [Vault]
      operationId: listVaultItems
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { description: Encrypted item heads and revisions }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Vault]
      operationId: createVaultItem
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVaultItem' }
      responses:
        '201': { description: Encrypted item created }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/vault-items/{item_id}:
    parameters: [{ $ref: '#/components/parameters/ItemPathId' }]
    patch:
      tags: [Vault]
      operationId: updateVaultItem
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EncryptedItemRevision' }
      responses:
        '200': { description: Encrypted revision created }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Vault]
      operationId: deleteVaultItem
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Encrypted item tombstoned }
        '409': { $ref: '#/components/responses/Error' }
  /v1/sync/changes:
    get:
      tags: [Vault]
      operationId: getSyncChanges
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Ordered metadata-only changes }
  /v1/missions:
    get:
      tags: [Access]
      operationId: listMissions
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { description: Encrypted mission definitions }
  /v1/access-requests:
    get:
      tags: [Access]
      operationId: listAccessRequests
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { description: Requests visible under RLS }
    post:
      tags: [Access]
      operationId: createAccessRequest
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccessRequest' }
      responses:
        '201': { description: Encrypted access request created }
        '422': { $ref: '#/components/responses/Error' }
  /v1/access-requests/{request_id}/decision:
    parameters:
      - name: request_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Access]
      operationId: decideAccessRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, denied] }
      responses:
        '200': { description: Decision recorded atomically }
        '403': { $ref: '#/components/responses/Error' }
  /v1/access-grants:
    get:
      tags: [Access]
      operationId: listAccessGrants
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { description: Time-boxed grants visible under RLS }
  /v1/connectors/catalog:
    get:
      tags: [SaaS]
      operationId: listConnectorCatalog
      description: Catalog entries describe contracts and maturity; they do not prove a live certified adapter.
      responses:
        '200': { description: Published connector catalog }
  /v1/connectors:
    get:
      tags: [SaaS]
      operationId: listTenantConnectors
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Tenant connector status without credential material }
  /v1/connectors/{connector_id}/reconcile:
    parameters:
      - name: connector_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [SaaS]
      operationId: reconcileConnector
      description: Fails closed unless the adapter is production-certified and its runtime is configured.
      responses:
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/saas/dashboard:
    get:
      tags: [SaaS]
      operationId: getSaasDashboard
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Privacy-minimized SaaS and AI aggregates }
  /v1/saas/applications:
    get:
      tags: [SaaS]
      operationId: listSaasApplications
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: "Inventory without raw page, form, vault, credential, or prompt content" }
  /v1/saas/recommendations:
    get:
      tags: [SaaS]
      operationId: listSaasRecommendations
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Proposal-first findings }
  /v1/saas/recommendations/refresh:
    post:
      tags: [SaaS]
      operationId: refreshSaasRecommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_id]
              properties: { tenant_id: { type: string, format: uuid } }
      responses:
        '200': { description: Proposals refreshed; no provider mutation is executed }
        '422': { $ref: '#/components/responses/Error' }
  /billing:
    post:
      tags: [Billing]
      operationId: billingAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingRequest' }
      responses:
        '200': { description: "Catalog, Checkout URL, or Customer Portal URL" }
        '400': { $ref: '#/components/responses/Error' }
  /tenant-sms:
    post:
      tags: [Notifications]
      operationId: tenantSmsAction
      description: Tenant-manager actions. Provider credentials are write-only after validation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantSmsRequest' }
      responses:
        '200': { description: Action-specific result }
        '400': { $ref: '#/components/responses/Error' }
  /account-lifecycle:
    post:
      tags: [Account]
      operationId: accountLifecycleAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountLifecycleRequest' }
      responses:
        '200': { description: Deletion preflight or completed deletion }
        '409': { $ref: '#/components/responses/Error' }
  /stripe-webhook:
    post:
      tags: [Provider callbacks]
      security: []
      operationId: receiveStripeWebhook
      description: Stripe-managed signed callback; not for customer integrations.
      responses:
        '200': { description: Accepted or idempotently ignored }
        '400': { description: Invalid signature or payload }
  /sent-webhook:
    post:
      tags: [Provider callbacks]
      security: []
      operationId: receiveSentWebhook
      description: Sent-managed signed callback; not for customer integrations.
      responses:
        '200': { description: Accepted or idempotently ignored }
        '400': { description: Invalid signature or payload }
  /sent-sms-hook:
    post:
      tags: [Provider callbacks]
      security: []
      operationId: receiveSupabaseSmsHook
      description: Supabase Auth send-SMS hook; not for customer integrations.
      responses:
        '200': { description: OTP submitted to the configured provider }
        '400': { description: Invalid signature or payload }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase-Auth-JWT
      description: Supabase Auth user access token. Never use service-role or secret keys in clients.
  parameters:
    TenantId:
      name: tenant_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspace_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    WorkspacePathId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemPathId:
      name: item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Recommended UUID or stable 16-128 character key for retried writes.
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current integer head revision, quoted or unquoted.
      schema: { type: string, pattern: '^"?[1-9][0-9]*"?$' }
  schemas:
    EncryptedItemRevision:
      type: object
      additionalProperties: false
      required: [nonce, ciphertext, aad_hash]
      properties:
        nonce: { type: string, description: PostgreSQL bytea text encoding }
        ciphertext: { type: string, description: PostgreSQL bytea text encoding }
        aad_hash: { type: string, description: PostgreSQL bytea text encoding }
    CreateVaultItem:
      allOf:
        - { $ref: '#/components/schemas/EncryptedItemRevision' }
        - type: object
          required: [id, tenant_id, workspace_id, content_type, schema_version]
          properties:
            id: { type: string, format: uuid }
            tenant_id: { type: string, format: uuid }
            workspace_id: { type: string, format: uuid }
            content_type:
              type: string
              enum: [login, passkey, secure-note, identity, payment-card, recovery-codes, wifi, software-license, api-key, ssh-key, database, certificate, custom-secret]
            schema_version: { type: integer, minimum: 1 }
    CreateAccessRequest:
      type: object
      additionalProperties: true
      required: [id, tenant_id, workspace_id, requested_scope, purpose_nonce, encrypted_purpose, purpose_aad_hash, requested_duration_minutes, expires_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        item_id: { type: ['string', 'null'], format: uuid }
        requested_scope: { type: string, enum: [use, reveal, edit, manage] }
        purpose_nonce: { type: string }
        encrypted_purpose: { type: string }
        purpose_aad_hash: { type: string }
        requested_duration_minutes: { type: integer, minimum: 5, maximum: 10080 }
        expires_at: { type: string, format: date-time }
    BillingRequest:
      type: object
      required: [action, tenantId]
      properties:
        action: { type: string, enum: [catalog, checkout, portal] }
        tenantId: { type: string, format: uuid }
        plan: { type: string, enum: [personal, family, professional, team, business] }
        interval: { type: string, enum: [month, year] }
        currency: { type: string, enum: [inr, usd] }
        quantity: { type: integer, minimum: 1, maximum: 500 }
        requestId: { type: string, format: uuid }
    TenantSmsRequest:
      type: object
      required: [action, tenantId]
      properties:
        action: { type: string, enum: [status, save_credential, enable, disable, send_verification, verify_phone, send_test] }
        tenantId: { type: string, format: uuid }
        apiKey: { type: string, writeOnly: true }
        senderProfileId: { type: string }
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', writeOnly: true }
        code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
        challengeId: { type: string, format: uuid }
        eventTypes: { type: array, uniqueItems: true, items: { type: string } }
    AccountLifecycleRequest:
      oneOf:
        - type: object
          required: [action]
          properties: { action: { const: preflight } }
        - type: object
          required: [action, confirmation]
          properties:
            action: { const: delete }
            confirmation: { const: DELETE MY ACCOUNT }
    Error:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: object
              required: [code, message, request_id]
              properties:
                code: { type: string }
                message: { type: string }
                request_id: { type: string }
            - type: string
  responses:
    Error:
      description: Safe structured error
      headers:
        x-request-id:
          description: Correlation identifier
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

