openapi: 3.1.0
info:
  title: Passkey-X API
  version: 0.3.0
  description: Ciphertext-only API contract for Passkey-X by Vlightsoft. Plaintext vault secrets are prohibited.
servers:
  - url: https://egqgzkirazabocqwdlfp.supabase.co/functions/v1/v1
    description: Development API
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /workspaces:
    get:
      operationId: listWorkspaces
      responses:
        '200':
          description: Active workspace ciphertext and caller membership
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Error' }
  /workspaces/{workspace_id}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspacePathId'
    get:
      operationId: listWorkspaceMembers
      responses:
        '200':
          description: Members visible under workspace RLS
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceMember' }
        '403': { $ref: '#/components/responses/Error' }
  /missions:
    get:
      operationId: listMissions
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Encrypted Mission definitions and their permitted item identifiers
          content:
            application/json:
              schema:
                type: object
                required: [missions]
                properties:
                  missions:
                    type: array
                    items: { $ref: '#/components/schemas/Mission' }
  /access-requests:
    get:
      operationId: listAccessRequests
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Requests visible under requester or manager RLS
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRequest' }
    post:
      operationId: createAccessRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccessRequest' }
      responses:
        '201': { description: Encrypted request created }
        '422': { $ref: '#/components/responses/Error' }
  /access-requests/{request_id}/decision:
    parameters:
      - name: request_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: decideAccessRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, denied] }
      responses:
        '200': { description: Approval decision recorded atomically }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /access-grants:
    get:
      operationId: listAccessGrants
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Active and historical timeboxed grants visible under RLS
        '403': { $ref: '#/components/responses/Error' }
  /vault-items:
    get:
      operationId: listVaultItems
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Encrypted item heads
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VaultItem' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createVaultItem
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVaultItem' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultItem' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /vault-items/{item_id}:
    parameters:
      - name: item_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getVaultItem
      responses:
        '200':
          description: Encrypted item and head revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultItem' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateVaultItem
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EncryptedRevision' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultItem' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteVaultItem
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      responses:
        '204': { description: Tombstone created }
        '409': { $ref: '#/components/responses/Error' }
  /sync/changes:
    get:
      operationId: getSyncChanges
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Ordered metadata-only changes
          content:
            application/json:
              schema:
                type: object
                required: [changes, cursor]
                properties:
                  changes:
                    type: array
                    items: { $ref: '#/components/schemas/SyncChange' }
                  cursor: { type: string }
  /api-tokens:
    post:
      operationId: createApiToken
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  items: { type: string }
                expires_at: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Token is returned once; only its hash is stored.
          content:
            application/json:
              schema:
                type: object
                required: [id, token]
                properties:
                  id: { type: string, format: uuid }
                  token: { type: string, writeOnly: true }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT-or-PAT
  parameters:
    WorkspacePathId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspace_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    Workspace:
      type: object
      additionalProperties: true
      required: [id, tenant_id, suite, status, current_key_version, encrypted_name]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        suite: { type: string, enum: [personal, family, professional, team] }
        status: { type: string, enum: [active, archived, closed] }
        current_key_version: { type: integer, minimum: 1 }
        key_rotation_required: { type: boolean }
        caller_role: { type: string, enum: [owner, manager, editor, viewer] }
        encrypted_name: { type: string, description: PostgreSQL bytea encoding }
        name_nonce: { type: [string, 'null'], description: PostgreSQL bytea encoding }
        name_aad_hash: { type: [string, 'null'], description: PostgreSQL bytea encoding }
    WorkspaceMember:
      type: object
      additionalProperties: false
      required: [identity_id, tenant_id, workspace_id, role, status]
      properties:
        identity_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        role: { type: string, enum: [owner, manager, editor, viewer] }
        status: { type: string, enum: [invited, active, suspended, revoked] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Mission:
      type: object
      additionalProperties: true
      required: [id, tenant_id, workspace_id, definition_nonce, encrypted_definition, definition_aad_hash, status]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        definition_nonce: { type: string, description: PostgreSQL bytea encoding }
        encrypted_definition: { type: string, description: PostgreSQL bytea encoding }
        definition_aad_hash: { type: string, description: PostgreSQL bytea encoding }
        status: { type: string, enum: [active, archived] }
    AccessRequest:
      type: object
      additionalProperties: false
      required: [id, tenant_id, workspace_id, requester_identity_id, requested_scope, purpose_nonce, encrypted_purpose, purpose_aad_hash, requested_duration_minutes, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        item_id: { type: [string, 'null'], format: uuid }
        requester_identity_id: { type: string, format: uuid }
        requested_scope: { type: string, enum: [use, reveal, edit, manage] }
        purpose_nonce: { type: string, description: PostgreSQL bytea encoding }
        encrypted_purpose: { type: string, description: PostgreSQL bytea encoding }
        purpose_aad_hash: { type: string, description: PostgreSQL bytea encoding }
        requested_duration_minutes: { type: integer, minimum: 5, maximum: 10080 }
        status: { type: string, enum: [pending, approved, denied, cancelled, expired] }
        expires_at: { type: string, format: date-time }
    CreateAccessRequest:
      allOf:
        - $ref: '#/components/schemas/AccessRequest'
        - type: object
          properties:
            requester_identity_id: { readOnly: true }
            status: { readOnly: true }
    EncryptedRevision:
      type: object
      additionalProperties: false
      required: [revision, envelope_version, algorithm, key_version, nonce, ciphertext, aad]
      properties:
        revision: { type: integer, minimum: 1 }
        envelope_version: { const: 1 }
        algorithm: { const: AES-256-GCM }
        key_version: { type: integer, minimum: 1 }
        nonce: { type: string, pattern: '^[A-Za-z0-9_-]{16}$' }
        ciphertext: { type: string, minLength: 22, pattern: '^[A-Za-z0-9_-]+$' }
        aad:
          $ref: '#/components/schemas/Aad'
    Aad:
      type: object
      additionalProperties: false
      required: [tenant_id, workspace_id, item_id, revision, content_type, schema_version]
      properties:
        tenant_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        content_type: { type: string, minLength: 3, maxLength: 128 }
        schema_version: { type: integer, minimum: 1 }
    CreateVaultItem:
      type: object
      additionalProperties: false
      required: [id, tenant_id, workspace_id, content_type, schema_version, revision]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        content_type: { type: string, minLength: 3, maxLength: 128 }
        schema_version: { type: integer, minimum: 1 }
        revision: { $ref: '#/components/schemas/EncryptedRevision' }
    VaultItem:
      allOf:
        - $ref: '#/components/schemas/CreateVaultItem'
        - type: object
          required: [head_revision, created_at, updated_at]
          properties:
            head_revision: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    SyncChange:
      type: object
      required: [sequence, entity_type, entity_id, operation, occurred_at]
      properties:
        sequence: { type: integer, minimum: 1 }
        entity_type: { enum: [item, attachment, membership, key_envelope] }
        entity_id: { type: string, format: uuid }
        operation: { enum: [create, update, delete, revoke] }
        entity_version: { type: [integer, 'null'], minimum: 1 }
        occurred_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
  responses:
    Error:
      description: Safe structured error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
